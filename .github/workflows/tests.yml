name: Tests

# Pure-Python test suite. No display, no psychopy init — these tests cover
# the display-free logic modules (design, layout, events, paths, markers,
# sync, settings) and run on every push / PR.
#
# The display-bound bits (task, session, gui rendering) are NOT covered
# here — they're verified manually on real hardware.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          # Use the same Python version we pin in .python-version.
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pure-Python tests
        run: uv run pytest tests/ -k "not integration" -v
